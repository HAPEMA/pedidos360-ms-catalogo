spring.application.name=ms-catalogo
server.port=${PORT:8081}

# Base de datos (RDS PostgreSQL); credenciales solo por variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
# Sin open-in-view: la sesión JPA no llega al controlador; el mapeo a DTO se hace en el servicio
spring.jpa.open-in-view=false

# Solo health expuesto por HTTP (sin detalles internos)
management.endpoints.web.exposure.include=health

# API Ninjas: la key nunca sale de este servidor
ninja.api-key=${NINJA_API_KEY}
ninja.base-url=${NINJA_BASE_URL:https://api.api-ninjas.com/v1}

# Cognito
app.security.issuer=https://cognito-idp.us-east-1.amazonaws.com/${COGNITO_POOL_ID}
app.security.client-id=${COGNITO_CLIENT_ID}

# Origen exacto del front para CORS
app.cors.origen=${FRONT_ORIGIN:http://localhost:4200}
